[package]
name = "omnidesk-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "OmniDesk 独立桌面外壳（P1-Desktop Phase 2 最小技术切片）"
default-run = "omnidesk-desktop"

# Rust 只负责：桌面宿主、进程生命周期、IPC。AI 逻辑在 Python Engine，执行引擎是 DSH。
[lib]
name = "omnidesk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
serde_yaml = "0.9"
