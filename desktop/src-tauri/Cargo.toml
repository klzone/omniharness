[package]
name = "omnidesk-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "OmniDesk 独立桌面外壳（P1-Desktop Phase 2 最小技术切片）"
default-run = "omnidesk-desktop"

[features]
# OD-ARCH-087：Tauri 用这个特性判定"生产模式"。
# 缺了它，即使是 --release 构建，Tauri 仍按开发模式加载 build.devUrl
# （http://127.0.0.1:5273），而正式启动器不起 dev server → 窗口报 Connection refused。
# 因此 release 构建必须显式带上它；debug 构建（dev-ui.sh）保持不带，才能连 dev server。
default = []
custom-protocol = ["tauri/custom-protocol"]

# Rust 只负责：桌面宿主、进程生命周期、IPC。AI 逻辑在 Python Engine，执行引擎是 DSH。
[lib]
name = "omnidesk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
# OD-ARCH-076：同一时间只允许一个 OmniDesk 实例；第二次启动聚焦已有窗口后退出。
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OD-KB-001 P2-S01：Frontmatter 只读解析。该 crate 早已在 Cargo.lock 中
# （此前仅作 dev-dependency），提升为生产依赖不引入新 crate，离线构建可用。
serde_yaml = "0.9"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
