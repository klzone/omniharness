# OmniDesk 运行底座锁定文件
#
# 本文件记录 OmniDesk 经过实机验证、可稳定运行的 DSH 底座版本。
# 升级 DSH 必须同时更新本文件，并重跑 tests/golden_tasks 与隔离自检。
#
# 权威来源（二选一，二者版本必须一致）：
#   1) 源码底本（git submodule）：runtime/deepseek-harness
#   2) 可运行 CLI（npm，由 scripts/bootstrap-runtime.sh 安装）
#
# OD-HARDEN-2043 T10：依赖安装改为可复现。
#   * DSH 依赖树：runtime/dsh-runtime.package.json + runtime/dsh-runtime.package-lock.json（npm ci）
#   * Profile 依赖树：samples/profiles/<name>.profile-lock.json（npm ci --omit=dev）
#   * Python：scripts/python-requirements.lock（pip install --require-hashes）
#   * pnpm：固定 11.28.11
# 升级 DSH 或任一依赖时，必须同时更新对应 lockfile，并重跑 tests/golden_tasks 与隔离自检；
# 只改版本号不改 lockfile 会让构建失败或装出与锁定不符的依赖树。

source:
  repo: https://github.com/deepseek-ai/deepseek-harness.git
  tag: dsh-v0.2.2-rc.5
  commit: 9c2670d3bce5275e0d1610272958121af87787bb

runtime:
  npm_package: "@deepseek-ai/dsh"
  version: 0.2.2-rc.5
  # 0.2.2 起 @deepseek-ai/dsh 自身声明 engines.node >= 24.9.0；
  # 应用侧的 Node 最低版本检查与之对齐（platform::environment_report）。
  node_engine: ">=24.9.0"
  install_dir: runtime/dsh-runtime   # 由 bootstrap 脚本生成，已被 .gitignore 排除

verified:
  date: 2026-11-02
  by: 实机安装并运行 `dsh --version` -> 0.2.1-rc.5
  notes: >
    升级自 0.2.1-alpha.2（2026-11-02）。兼容性已实测：
    --dump-config / plugin ls / 真实启动 omnidesk-base 均通过。
    OmniDesk 的隔离启动器优先使用本锁定版本，确保任何机器上下载即得同一底座。

