<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>OmniDesk UI 负载对照 · 复刻重特效页</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5ff; overflow: hidden; }
  /* 复刻 App.tsx 的三个全屏高斯模糊光斑 */
  .blob { position: fixed; border-radius: 9999px; pointer-events: none; }
  .b1 { top: -15%; left: 20%; width: 60rem; height: 50rem; background: linear-gradient(135deg, #c7d2fe, #ddd6fe); filter: blur(130px); }
  .b2 { top: 45%; right: -10%; width: 48rem; height: 48rem; background: linear-gradient(315deg, #dbe0ff, #e0e7ff); filter: blur(140px); }
  .b3 { bottom: -20%; left: 8%; width: 42rem; height: 42rem; background: linear-gradient(45deg, #e8e6ff, #eef0ff); filter: blur(120px); }
  /* 复刻 Dock / 顶栏的 backdrop-blur-2xl 与卡片的 blur(20–28px) */
  .dock { position: fixed; left: 20px; top: 40%; width: 64px; height: 320px; border-radius: 9999px;
          background: rgba(255,255,255,.85); backdrop-filter: blur(40px) saturate(170%); }
  .nav  { position: fixed; left: 120px; right: 40px; top: 24px; height: 56px; border-radius: 9999px;
          background: rgba(255,255,255,.8); backdrop-filter: blur(40px) saturate(170%); }
  .panes { position: relative; padding: 120px 40px 40px 120px; display: flex; flex-direction: column; gap: 18px; }
  .pane { background: rgba(255,255,255,.78); backdrop-filter: blur(20px) saturate(160%);
          border: 1px solid rgba(255,255,255,.9); border-radius: 16px; padding: 20px 24px; height: 90px; }
  .plate { background: rgba(255,255,255,.72); backdrop-filter: blur(28px) saturate(170%);
           border-radius: 16px; padding: 20px 24px; height: 90px; }
  /* 复刻无限动画：pulse-subtle 6s / float-companion 5s */
  @keyframes pulse-subtle { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .75; transform: scale(1.05);} }
  @keyframes float-companion { 0%,100% { transform: translateY(0) rotate(0);} 50% { transform: translateY(-7px) rotate(1.2deg);} }
  .pulse { position: fixed; right: 60px; bottom: 60px; width: 120px; height: 120px; border-radius: 24px;
           background: #6366f1; animation: pulse-subtle 6s cubic-bezier(.4,0,.6,1) infinite; }
  .mascot { position: fixed; right: 220px; bottom: 60px; width: 112px; height: 112px; border-radius: 50%;
            background: #a5b4fc; animation: float-companion 5s ease-in-out infinite; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="nav"></div><div class="dock"></div>
  <div class="panes">
    <div class="plate">plate（blur 28px）</div>
    <div class="pane">pane（blur 20px）</div>
    <div class="pane">pane（blur 20px）</div>
    <div class="pane">pane（blur 20px）</div>
    <div class="pane">pane（blur 20px）</div>
  </div>
  <div class="pulse"></div><div class="mascot"></div>
</body>
</html>
