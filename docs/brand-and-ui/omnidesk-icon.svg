<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="116" fill="#0B0F17"/>
  <rect width="510" height="510" x="1" y="1" rx="115" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <defs>
    <!-- Gradient for O (Continuous Omni Ring / Left) -->
    <linearGradient id="omniGrad" x1="120" y1="120" x2="300" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    
    <!-- Gradient for D (Structured Desk Arc / Right) -->
    <linearGradient id="deskGrad" x1="220" y1="120" x2="400" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Core Glow & Highlights -->
    <filter id="monomarkGlow" x="70" y="70" width="372" height="372" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="coreBeam" x1="256" y1="190" x2="256" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <g filter="url(#monomarkGlow)">
    <!-- O Component: Precision Capsule Loop (The Runtime Loop) -->
    <!-- Outer boundary of O: x: 104, y: 128, w: 156, h: 256, rx: 78 -->
    <rect x="104" y="128" width="156" height="256" rx="78" stroke="url(#omniGrad)" stroke-width="28" stroke-linejoin="round"/>

    <!-- D Component: Structured Extension Arc (The Workbench Surface) -->
    <!-- D shares the center spine and sweeps out to x: 408 -->
    <path d="M 236 128 H 280 C 350.69 128 408 185.31 408 256 C 408 326.69 350.69 384 280 384 H 236" 
          stroke="url(#deskGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Intersection / Neural Bridge (Connecting O and D) -->
    <!-- The vertical shared spine representing the Agent Dispatch Seam -->
    <line x1="248" y1="168" x2="248" y2="344" stroke="url(#coreBeam)" stroke-width="14" stroke-linecap="round"/>

    <!-- 5 Agent Nodes: 5 glowing orbital anchors representing the 5 Agents -->
    <!-- Memory Agent Node (Top Left) -->
    <circle cx="182" cy="128" r="10" fill="#38BDF8"/>
    <!-- Knowledge Agent Node (Bottom Left) -->
    <circle cx="182" cy="384" r="10" fill="#818CF8"/>
    <!-- Central Dispatch Node (Bridge) -->
    <circle cx="248" cy="256" r="14" fill="#FFFFFF"/>
    <!-- Project Agent Node (Top Right) -->
    <circle cx="344" cy="154" r="10" fill="#818CF8"/>
    <!-- Coding / Writing Node (Bottom Right) -->
    <circle cx="344" cy="358" r="10" fill="#C084FC"/>
  </g>
</svg>
