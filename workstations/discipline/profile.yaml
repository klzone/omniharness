# ==============================================================================
# 【规划声明 · 非生效配置】
#
# 本文件不被任何加载器读取；DSH 只读取 profiles/<name>/ 下的 cordis.patch.yml 与
# package.json。真正生效的 OmniDesk Profile 配置源在 profiles/yvan-work/。
#
# 本文件保留为「Discipline 工作站」的领域规划声明（模型偏好、领域目录设想）。
# 其中 workspacePaths 指向的 ~/OmniDesk/workspaces/discipline 等路径目前尚未建立。
# 请勿把它当作生效配置来修改；要改运行行为请改 profiles/yvan-work/。
# ==============================================================================
# OmniDesk Discipline Workstation Profile
# 业务领域：纪检监察综合履职工作站配置
# 适配运行时：DeepSeek Harness (DSH) Profile / Cordis Patch Specification
# ==============================================================================

name: "omnidesk-discipline"
displayName: "OmniDesk Discipline Workstation"
description: "AI Workstation tailored for discipline inspection and supervision comprehensive duties."
version: "0.1.0"

# 基础模型与推理默认设定
defaults:
  provider: agnescom
  model: agnes-3.0-flash
  reasoningEffort: high

# DSH Cordis 插件覆盖层 (直接映射为 cordis.patch.yml)
cordisPatch:
  - id: agent-default-model
    name: "@deepseek-ai/dsh-agent-default-model"
    config:
      provider: agnescom
      model: agnes-3.0-flash
      reasoningEffort: high

  - id: ui-settings-general
    name: "@deepseek-ai/dsh-client-ui-settings-general"
    config:
      welcomeNoticeVersion: 2026-09-28.1

  - id: ui-chat
    name: "@deepseek-ai/dsh-client-ui-chat"
    config:
      transcriptView: detailed
      linkOpening: new-tab

  # 禁用与纪检履职无关的多余交互面板
  - id: ui-settings
    name: "@deepseek-ai/dsh-client-ui-settings"
    config:
      enabled: false

# 领域工作站挂载目录
workspacePaths:
  root: "~/OmniDesk/workspaces/discipline"
  knowledge: "~/OmniDesk/knowledge"
  templates: "workstations/discipline/templates"
  memory: "~/OmniDesk/memory"
